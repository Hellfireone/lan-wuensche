<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>LAN-Spielewünsche</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: schmale Handy-Spalte, Spielkacheln als Liste, feste Leiste unten mit Zähler und Senden */
:root{
  --bg:#eef1f6; --flaeche:#ffffff; --fg:#141a26; --leise:#5b6578; --linie:#d5dbe6;
  --akzent:#1f6feb; --akzent-fg:#ffffff; --bereit:#1a7f4b; --fehlt:#b4561b; --wa:#1f9d55;
  --display:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;
  --text:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e131d; --flaeche:#161d2b; --fg:#e7ecf5; --leise:#9aa5ba; --linie:#28324a;
  --akzent:#5b9dff; --akzent-fg:#0b1020; --bereit:#4cc488; --fehlt:#f0975a; --wa:#3cc275; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131d; --flaeche:#161d2b; --fg:#e7ecf5; --leise:#9aa5ba; --linie:#28324a;
  --akzent:#5b9dff; --akzent-fg:#0b1020; --bereit:#4cc488; --fehlt:#f0975a; --wa:#3cc275; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--text);font-size:15px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 140px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:16px}
h1{font-family:var(--display);font-size:28px;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
.unter{color:var(--leise);margin:4px 0 0}
label.feld{display:grid;gap:6px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--leise)}
input[type=text],input[type=search]{font:inherit;font-size:16px;color:var(--fg);background:var(--flaeche);
  border:1px solid var(--linie);border-radius:10px;padding:11px 12px;width:100%;text-transform:none;letter-spacing:0}
input:focus-visible,button:focus-visible{outline:2px solid var(--akzent);outline-offset:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--linie);background:var(--flaeche);color:var(--fg);
  border-radius:999px;padding:7px 12px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--akzent);border-color:var(--akzent);color:var(--akzent-fg)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.75;margin-left:4px}
.genres{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.genres .chip{white-space:nowrap;font-weight:500}
ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.spiel{display:grid;grid-template-columns:auto auto 1fr auto;gap:12px;align-items:center;background:var(--flaeche);
  border:1px solid var(--linie);border-radius:12px;padding:10px 12px;cursor:pointer;user-select:none}
.spiel[aria-checked=true]{border-color:var(--akzent);box-shadow:inset 0 0 0 1px var(--akzent)}
.box{width:22px;height:22px;border-radius:6px;border:2px solid var(--linie);display:grid;place-items:center}
.spiel[aria-checked=true] .box{background:var(--akzent);border-color:var(--akzent)}
.spiel[aria-checked=true] .box::after{content:"";width:6px;height:11px;border:solid var(--akzent-fg);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.titel{font-weight:600;min-width:0}
.cover{width:70px;height:50px;max-width:100%;border-radius:6px;object-fit:cover;background:var(--linie);display:block}
.spiel[aria-checked=true] .cover{outline:2px solid var(--akzent);outline-offset:1px}
.meta{color:var(--leise);font-size:13px}
.status{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.status.b{color:var(--bereit)} .status.f{color:var(--fehlt)}
.leer{color:var(--leise);text-align:center;padding:24px 0}
.leiste{position:fixed;left:0;right:0;bottom:0;background:var(--flaeche);border-top:1px solid var(--linie);
  padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.leiste-in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.zaehler{flex:1 1 140px;font-size:13px;color:var(--leise)}
.zaehler b{color:var(--fg);font-size:18px;font-variant-numeric:tabular-nums}
.knopf{font:inherit;font-weight:600;border-radius:10px;padding:11px 14px;cursor:pointer;text-decoration:none;
  border:1px solid var(--linie);background:var(--flaeche);color:var(--fg);display:inline-flex;align-items:center;gap:8px}
.knopf.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.knopf[aria-disabled=true]{opacity:.45;pointer-events:none}
.hinweis{font-size:13px;color:var(--leise);min-height:1em}
.vorschau{background:var(--flaeche);border:1px dashed var(--linie);border-radius:12px;padding:12px;font-size:13px;white-space:pre-wrap;color:var(--leise);margin:0}
@media (prefers-reduced-motion:no-preference){.spiel{transition:border-color .12s}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>Was zocken wir auf der LAN?</h1>
    <p class="unter">Hak an, was du spielen willst, und schick deine Liste in die Gruppe. Was noch nicht auf dem Server liegt, wird vorher geladen.</p>
  </header>

  <label class="feld" for="name">Dein Name
    <input type="text" id="name" placeholder="z. B. Sebastian" autocomplete="nickname">
  </label>

  <label class="feld" for="suche">Suchen
    <input type="search" id="suche" placeholder="Spiel suchen …">
  </label>

  <div class="tabs" role="group" aria-label="Status">
    <button class="chip" data-tab="alle" aria-pressed="true">Alle<span class="n" id="n-alle"></span></button>
    <button class="chip" data-tab="b" aria-pressed="false">Auf dem Server<span class="n" id="n-b"></span></button>
    <button class="chip" data-tab="f" aria-pressed="false">Noch nicht geladen<span class="n" id="n-f"></span></button>
    <button class="chip" data-tab="meine" aria-pressed="false">Meine Auswahl<span class="n" id="n-meine"></span></button>
  </div>
  <div class="genres" id="genres" role="group" aria-label="Genre"></div>

  <ul id="liste"></ul>

  <details>
    <summary class="meta" style="cursor:pointer">So sieht deine Nachricht aus</summary>
    <pre class="vorschau" id="vorschau"></pre>
  </details>
</div>

<div class="leiste">
  <div class="leiste-in">
    <div class="zaehler"><b id="anzahl">0</b> Spiele gewählt<br><span id="davon"></span></div>
    <button class="knopf" id="kopieren" type="button">Kopieren</button>
    <a class="knopf wa" id="senden" href="#" target="_blank" rel="noopener" aria-disabled="true">An WhatsApp senden</a>
    <div class="hinweis" id="hinweis" aria-live="polite" style="flex-basis:100%"></div>
  </div>
</div>

const spiele = [...DATEN.bereit.map(s => ({...s, b: true})), ...DATEN.fehlt.map(s => ({...s, b: false}))]
  .sort((x, y) => x.t.localeCompare(y.t, "de"));
const gewaehlt = new Set();
let tab = "alle", genre = "";
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);

try { JSON.parse(localStorage.getItem("wunsch") || "[]").forEach(id => gewaehlt.add(id)); $("name").value = localStorage.getItem("wunsch-name") || ""; } catch (e) {}
function merken() { try { localStorage.setItem("wunsch", JSON.stringify([...gewaehlt])); localStorage.setItem("wunsch-name", $("name").value); } catch (e) {} }

const genres = [...new Set(spiele.map(s => s.g).filter(Boolean))].sort((a, b) => a.localeCompare(b, "de"));
$("genres").innerHTML = ['<button class="chip" data-genre="" aria-pressed="true">Alle Genres</button>',
  ...genres.map(g => `<button class="chip" data-genre="${esc(g)}" aria-pressed="false">${esc(g)}</button>`)].join("");

function passt(s) {
  const q = $("suche").value.trim().toLowerCase();
  if (q && !s.t.toLowerCase().includes(q)) return false;
  if (genre && s.g !== genre) return false;
  if (tab === "b") return s.b;
  if (tab === "f") return !s.b;
  if (tab === "meine") return gewaehlt.has(s.id);
  return true;
}

function zeichnen() {
  const treffer = spiele.filter(passt);
  $("liste").innerHTML = treffer.length ? treffer.map(s => `
    <li class="spiel" role="checkbox" tabindex="0" data-id="${esc(s.id)}" aria-checked="${gewaehlt.has(s.id)}">
      <span class="box" aria-hidden="true"></span>
      <img class="cover" src="cover/${esc(s.id)}.jpg" alt="" loading="lazy" width="70" height="50">
      <span class="titel">${esc(s.t)}<br><span class="meta">${[esc(s.g), s.p ? "bis " + s.p + " Spieler" : ""].filter(Boolean).join(" · ")}</span></span>
      <span class="status ${s.b ? "b" : "f"}">${s.b ? "bereit" : "laden"}</span>
    </li>`).join("") : '<li class="leer">Kein Spiel gefunden.</li>';
  zaehlen();
}

function nachricht() {
  const name = $("name").value.trim() || "Ich";
  const wahl = spiele.filter(s => gewaehlt.has(s.id));
  const b = wahl.filter(s => s.b).map(s => "• " + s.t), f = wahl.filter(s => !s.b).map(s => "• " + s.t);
  let t = `🎮 LAN-Wünsche von ${name} (${wahl.length} Spiele)\n`;
  if (b.length) t += `\n✅ Schon auf dem Server:\n${b.join("\n")}\n`;
  if (f.length) t += `\n⬇️ Bitte vorher laden:\n${f.join("\n")}\n`;
  return t;
}

function zaehlen() {
  const wahl = spiele.filter(s => gewaehlt.has(s.id)), f = wahl.filter(s => !s.b).length;
  $("anzahl").textContent = wahl.length;
  $("davon").textContent = wahl.length ? `${wahl.length - f} bereit, ${f} müssen geladen werden` : "Tipp Spiele in der Liste an";
  $("n-alle").textContent = spiele.length;
  $("n-b").textContent = DATEN.bereit.length;
  $("n-f").textContent = DATEN.fehlt.length;
  $("n-meine").textContent = wahl.length;
  const text = nachricht();
  $("vorschau").textContent = wahl.length ? text : "Noch nichts gewählt.";
  $("senden").href = "https://wa.me/?text=" + encodeURIComponent(text);
  $("senden").setAttribute("aria-disabled", wahl.length ? "false" : "true");
}

function umschalten(li) {
  const id = li.dataset.id;
  gewaehlt.has(id) ? gewaehlt.delete(id) : gewaehlt.add(id);
  li.setAttribute("aria-checked", gewaehlt.has(id));
  merken();
  tab === "meine" ? zeichnen() : zaehlen();
}

$("liste").addEventListener("click", e => { const li = e.target.closest(".spiel"); if (li) umschalten(li); });
$("liste").addEventListener("keydown", e => { const li = e.target.closest(".spiel"); if (li && (e.key === " " || e.key === "Enter")) { e.preventDefault(); umschalten(li); } });
document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  tab = b.dataset.tab; document.querySelectorAll("[data-tab]").forEach(x => x.setAttribute("aria-pressed", x === b)); zeichnen();
});
$("genres").addEventListener("click", e => {
  const b = e.target.closest("[data-genre]"); if (!b) return;
  genre = b.dataset.genre; document.querySelectorAll("[data-genre]").forEach(x => x.setAttribute("aria-pressed", x === b)); zeichnen();
});
$("suche").addEventListener("input", zeichnen);
$("name").addEventListener("input", () => { merken(); zaehlen(); });
$("kopieren").addEventListener("click", () => {
  const text = nachricht();
  navigator.clipboard.writeText(text).then(() => $("hinweis").textContent = "Kopiert. In WhatsApp einfügen und senden.")
    .catch(() => { document.querySelector("details").open = true; getSelection().selectAllChildren($("vorschau")); $("hinweis").textContent = "Text ist markiert, jetzt kopieren."; });
});
zeichnen();
</script>
